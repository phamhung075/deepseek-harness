# Bundle layer: mounts every fork plugin. Installed from the web "Add plugin" box with
#   link:<repo>/fork
- insert:
    - id: fork-live-sync
      name: '@phamhung075/dsh-fork/live-sync'
    - id: fork-live-writer
      name: '@phamhung075/dsh-fork/live-writer'
    - id: fork-job-control
      name: '@phamhung075/dsh-fork/job-control'
    - id: fork-offload-gui
      name: '@phamhung075/dsh-fork/offload-gui'
